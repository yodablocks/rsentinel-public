[package]
name = "rsentinel"
version = "0.1.0"
edition = "2024"
description = "Defensive security posture scanner: TLS, HTTP headers, DNS, CORS and exposure checks with SARIF output"
license = "MIT"
repository = "https://github.com/yodablocks/rsentinel-public"
homepage = "https://github.com/yodablocks/rsentinel-public"
authors = ["yodablocks"]

[dependencies]
# HTTP client for API calls
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Rate limiting
governor = "0.8"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment variables
dotenvy = "0.15"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
pretty_assertions = "1.4"

[[bin]]
name = "rsentinel"
path = "src/main.rs"
